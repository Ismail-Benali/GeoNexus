name: Deploy GeoNexus to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # GitHub Pages serves HTML with max-age=600, so a visitor can hold a stale
          # index.html that still points at the previous deploy's hashed assets.
          # A clean publish deletes those files, producing 404s until the cache expires.
          # Keeping the previous files means those stale references still resolve.
          keep_files: true
